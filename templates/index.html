<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sburg — Search Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="logo-section">
            <h1 class="logo-big">
                <span class="logo-letter" style="--i:0">S</span>
                <span class="logo-letter" style="--i:1">b</span>
                <span class="logo-letter" style="--i:2">u</span>
                <span class="logo-letter" style="--i:3">r</span>
                <span class="logo-letter" style="--i:4">g</span>
            </h1>
            <p class="tagline">Search the web, more information.</p>
        </div>

        <form action="/search" method="get" class="search-form" autocomplete="off">
            <div class="search-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" name="q" placeholder="Search anything..." autofocus>
                <select class="search-category" name="category" aria-label="Search category">
                    <option value="all" selected>All</option>
                    <option value="ai">AI</option>
                </select>
                <button type="submit">
                    <span>Search</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <div class="suggestions-box" id="suggestions" style="display:none;"></div>
            </div>
        </form>

        <div class="quick-tags">
            <span class="quick-label">Try:</span>
            <a href="/search?q=python" class="tag">python</a>
            <a href="/search?q=search engine" class="tag">search engine</a>
            <a href="/search?q=web crawler" class="tag">web crawler</a>
            <a href="/search?q=machine learning" class="tag">machine learning</a>
        </div>

        <!-- ============================================
             SHORTCUTS SECTION
             ============================================ -->
        <section class="shortcuts-section">
            <div class="shortcuts-header">
                <h3 class="shortcuts-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    Shortcuts
                </h3>
            </div>

            <div class="shortcuts-grid" id="shortcutsGrid"></div>
        </section>

        <p class="footer">Made in Tanzania</p>
    </div>

    <button class="ai-voice-button" id="aiVoiceButton" type="button" aria-label="Hear the Sburg welcome message">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0-6 6v3a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <path d="M12 19v3"></path>
            <path d="M8 22h8"></path>
            <path d="m19 3 1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2Z"></path>
        </svg>
        <span>AI voice</span>
    </button>
    <p class="ai-voice-status" id="aiVoiceStatus" aria-live="polite"></p>

    <!-- ============================================
         MODAL: ADD SHORTCUT
         ============================================ -->
    <div class="modal-overlay" id="shortcutModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Add a shortcut</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <label>Name</label>
                <input type="text" id="shortcutName" placeholder="e.g. YouTube">

                <label>URL (use %s for query)</label>
                <input type="text" id="shortcutUrl" placeholder="e.g. https://youtube.com/results?search_query=%s">

                <label>Icon (URL or emoji)</label>
                <input type="text" id="shortcutIcon" placeholder="e.g. /static/icon/Google.png or 🔍">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn-primary" id="modalSave">Save shortcut</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // AUTOCOMPLETE
        // ============================================
        const input = document.querySelector('input[name="q"]');
        const suggestionBox = document.getElementById('suggestions');

        let timeout;
        input.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(async () => {
                const q = input.value.trim();
                if (q.length < 2) {
                    suggestionBox.style.display = 'none';
                    return;
                }
                try {
                    const res = await fetch(`/suggest?q=${encodeURIComponent(q)}`);
                    const suggestions = await res.json();
                    if (suggestions.length > 0) {
                        suggestionBox.innerHTML = suggestions
                            .map(s => `<div class="suggestion-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <span>${s}</span>
                            </div>`)
                            .join('');
                        suggestionBox.style.display = 'block';
                        suggestionBox.querySelectorAll('.suggestion-item').forEach(item => {
                            item.addEventListener('click', () => {
                                input.value = item.querySelector('span').textContent;
                                suggestionBox.style.display = 'none';
                                input.form.submit();
                            });
                        });
                    } else {
                        suggestionBox.style.display = 'none';
                    }
                } catch (e) {
                    suggestionBox.style.display = 'none';
                }
            }, 150);
        });

        document.addEventListener('click', (e) => {
            if (!input.contains(e.target) && !suggestionBox.contains(e.target)) {
                suggestionBox.style.display = 'none';
            }
        });

        // ============================================
        // SHORTCUTS - LOCALSTORAGE
        // ============================================
        const STORAGE_KEY = 'sburg_shortcuts_v4';

        // ============================================
        // DEFAULT SHORTCUTS - PICHA HALISI
        // ============================================
        const DEFAULT_SHORTCUTS = [
    {
        name: 'Google',
        url: 'https://www.google.com/search?q=%s',
        icon: '/static/icon/Google.png'
    },
    {
        name: 'youTube',
        url: 'https://www.youtube.com/results?search_query=%s',
        icon: '/static/icon/YouTube.png'
    },
    {
        name: 'github',
        url: 'https://github.com/search?q=%s',
        icon: '/static/icon/GitHub.png'
    },
    {
        name: 'WhatsApp',
        url: 'https://web.whatsapp.com/send?text=%s',
        icon: '💬'
    },
    {
        name: 'Code Union',
        url: 'https://codeunionsoftware.com/search?q=code+union+%s',
        icon: '/static/icon/CodeUnion.ico'
    }
];

        function loadShortcuts() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    return JSON.parse(stored).map(shortcut => {
                        const iconName = shortcut.icon?.split('/').pop();
                        const iconPaths = {
                            'Google.png': '/static/icon/Google.png',
                            'YouTube.png': '/static/icon/YouTube.png',
                            'GitHub.png': '/static/icon/GitHub.png',
                            'CodeUnion.ico': '/static/icon/CodeUnion.ico',
                            'WhatsApp.png': '💬'
                        };
                        return iconPaths[iconName]
                            ? { ...shortcut, icon: iconPaths[iconName] }
                            : shortcut;
                    });
                } catch (e) {
                    return [...DEFAULT_SHORTCUTS];
                }
            }
            return [...DEFAULT_SHORTCUTS];
        }

        function saveShortcuts(shortcuts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
        }

        // ============================================
        // HELPER: Detect if icon is URL or emoji
        // ============================================
        function isIconUrl(icon) {
            if (!icon) return false;
            return icon.startsWith('http://') ||
                   icon.startsWith('https://') ||
                   icon.startsWith('/static/') ||
                   icon.startsWith('data:');
        }

        function renderShortcuts() {
            const shortcuts = loadShortcuts();
            const grid = document.getElementById('shortcutsGrid');
            grid.innerHTML = '';

            // 1. Onyesha shortcuts zote
            shortcuts.forEach((s, index) => {
                const card = document.createElement('div');
                card.className = 'shortcut-card';

                const iconHtml = isIconUrl(s.icon)
                    ? `<img src="${s.icon}" alt="${s.name}" class="shortcut-img" onerror="this.style.display='none'; this.parentNode.innerHTML='🔗';">`
                    : (s.icon || '🔗');

                card.innerHTML = `
                    <button class="shortcut-remove" title="Remove" data-index="${index}">&times;</button>
                    <div class="shortcut-icon">${iconHtml}</div>
                    <div class="shortcut-name">${s.name}</div>
                `;

                // CLICK LOGIC - INAFANYA KAZI HATA BILA NENO
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('shortcut-remove')) return;
                    const q = input.value.trim();
                    let url;

                    if (q) {
                        url = s.url.replace('%s', encodeURIComponent(q));
                    } else {
                        url = s.url.split('?')[0];
                    }
                    window.open(url, '_blank');
                });

                grid.appendChild(card);
            });

            // 2. "Add shortcut" card MWISHONI
            const addCard = document.createElement('div');
            addCard.className = 'shortcut-card add-card';
            addCard.innerHTML = `
                <div class="add-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
                <div class="shortcut-name">Add shortcut</div>
            `;
            addCard.addEventListener('click', openModal);
            grid.appendChild(addCard);

            // 3. Remove buttons
            grid.querySelectorAll('.shortcut-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    const shortcuts = loadShortcuts();
                    shortcuts.splice(idx, 1);
                    saveShortcuts(shortcuts);
                    renderShortcuts();
                });
            });
        }

        // ============================================
        // MODAL LOGIC
        // ============================================
        const modal = document.getElementById('shortcutModal');
        const modalClose = document.getElementById('modalClose');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');

        function openModal() {
            modal.style.display = 'flex';
            setTimeout(() => document.getElementById('shortcutName').focus(), 100);
        }

        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('shortcutName').value = '';
            document.getElementById('shortcutUrl').value = '';
            document.getElementById('shortcutIcon').value = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalCancel.addEventListener('click', closeModal);

        modalSave.addEventListener('click', () => {
            const name = document.getElementById('shortcutName').value.trim();
            const url  = document.getElementById('shortcutUrl').value.trim();
            const icon = document.getElementById('shortcutIcon').value.trim();

            if (!name || !url) {
                alert('Please fill in Name and URL.');
                return;
            }

            const shortcuts = loadShortcuts();
            shortcuts.push({ name, url, icon: icon || '🔗' });
            saveShortcuts(shortcuts);
            renderShortcuts();
            closeModal();
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
            if (e.key === 'Enter' && modal.style.display === 'flex') {
                if (document.activeElement.tagName === 'INPUT') modalSave.click();
            }
        });

        // ============================================
        // INITIALIZE
        // ============================================
        renderShortcuts();

        const aiVoiceButton = document.getElementById('aiVoiceButton');
        const aiVoiceStatus = document.getElementById('aiVoiceStatus');
        const welcomeMessage = 'Welcome to Sburg Search. Search the web for more information and details.';

        function speakWelcome() {
            if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                aiVoiceStatus.textContent = 'Voice playback is not supported in this browser.';
                return;
            }

            window.speechSynthesis.cancel();
            const welcome = new SpeechSynthesisUtterance(welcomeMessage);
            welcome.lang = 'en-GB';
            welcome.onstart = () => {
                aiVoiceStatus.textContent = 'Speaking the Sburg welcome message.';
            };
            welcome.onend = () => {
                aiVoiceStatus.textContent = '';
            };
            welcome.onerror = () => {
                aiVoiceStatus.textContent = 'Could not play the welcome message. Press the AI voice button to try again.';
            };
            window.speechSynthesis.speak(welcome);
        }

        aiVoiceButton.addEventListener('click', speakWelcome);
        window.addEventListener('load', speakWelcome, { once: true });
    </script>
</body>
</html>
